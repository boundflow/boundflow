name: Publish backend image

# Builds the BoundFlow backend image and pushes it to GitHub Container Registry
# (ghcr.io/<owner>/boundflow), tagged with the release version, for anyone
# self-hosting a pinned version. Runs on version tags (v*) and on manual dispatch.
#
# BoundFlow's own cloud tracks main instead and is rolled by deploy-test.yml, which
# publishes sha-tagged images of its own.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/boundflow
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
