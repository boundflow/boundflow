name: Deploy to test cloud

# Keeps the shared cloud environment on main. It is where prospects poke around, so
# it deploys on a green Tests run rather than on merge — but it deploys every time,
# because the failure mode that actually bit us was the opposite: cloud sat 94 commits
# and three weeks behind because deploying was a manual afternoon.
#
# Deploying continuously also keeps the server ahead of every published SDK, which is
# the only safe direction. A client calling an RPC its server lacks fails; a server
# ahead of its client is invisible.
#
# One-time setup (see docs/deployment.md):
#   - an Azure app registration with a federated credential for this repo
#   - AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID as repo variables
#   - the app assigned Contributor on the boundflow_test resource group
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # federated credential; nothing stored

env:
  RESOURCE_GROUP: boundflow_test
  MIGRATE_JOB: boundflow-migrate-test
  APPS: boundflow-server-test boundflow-scheduler-test boundflow-worker-test

jobs:
  deploy:
    # workflow_run fires on failure too, so gate on the conclusion. Manual dispatch
    # has no upstream run and is trusted to know what it's doing.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: test-cloud
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, not the commit
          # that was tested. Pin to the tested SHA so the image matches the tests.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Derive image tag
        id: img
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/boundflow:${{ steps.img.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/boundflow:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Migrations run inside the managed environment: the database has public access
      # disabled and lives on a delegated subnet, so a runner cannot reach it. The job
      # shares the apps' database secret, so there is one connection string.
      - name: Migrate
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/${{ github.repository_owner }}/boundflow:${{ steps.img.outputs.tag }}
          az containerapp job update -n "$MIGRATE_JOB" -g "$RESOURCE_GROUP" --image "$IMAGE"
          EXEC=$(az containerapp job start -n "$MIGRATE_JOB" -g "$RESOURCE_GROUP" \
                   --query name -o tsv)
          echo "migration job execution: $EXEC"
          for _ in $(seq 1 60); do
            STATUS=$(az containerapp job execution show -n "$MIGRATE_JOB" \
                       -g "$RESOURCE_GROUP" --job-execution-name "$EXEC" \
                       --query properties.status -o tsv)
            echo "  status: $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Degraded)
                # Deploying a binary onto a schema it does not match is worse than
                # not deploying, so stop here rather than continuing.
                echo "::error::migration failed; apps left on the previous image"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::migration did not finish in 10 minutes"
          exit 1

      - name: Update the container apps
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/${{ github.repository_owner }}/boundflow:${{ steps.img.outputs.tag }}
          for app in $APPS; do
            az containerapp update -n "$app" -g "$RESOURCE_GROUP" --image "$IMAGE" -o none
            echo "updated $app"
          done

      - name: Verify the revisions came up
        run: |
          set -euo pipefail
          for app in $APPS; do
            for _ in $(seq 1 30); do
              REV=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" \
                      --query properties.latestRevisionName -o tsv)
              STATE=$(az containerapp revision show -n "$app" -g "$RESOURCE_GROUP" \
                        --revision "$REV" --query properties.runningState -o tsv)
              [ "$STATE" = "Running" ] && { echo "$app: $REV Running"; break; }
              [ "$STATE" = "Failed" ] && { echo "::error::$app: $REV $STATE"; exit 1; }
              sleep 10
            done
            [ "${STATE:-}" = "Running" ] || {
              echo "::error::$app did not reach Running"; exit 1; }
          done
