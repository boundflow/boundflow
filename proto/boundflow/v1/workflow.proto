syntax = "proto3";

package boundflow.v1;

option go_package = "github.com/boundflow/boundflow/gen/boundflow/v1;boundflowv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// InvokeMode controls what happens when invokes pile up for a workflow.
enum InvokeMode {
  INVOKE_MODE_UNSPECIFIED = 0;  // treated as COALESCE
  // Latest-wins: a newer invoke supersedes older pending ones (reconcile/periodic).
  INVOKE_MODE_COALESCE = 1;
  // Every invoke runs, drained oldest-first, one at a time (fan-in / request-response).
  INVOKE_MODE_QUEUE = 2;
}

message WorkflowConfig {
  int32 version = 1;
  int32 invoke_timeout_seconds = 2;
  int32 repeat_every_seconds = 3;
  bool triggerable = 4;
  InvokeMode invoke_mode = 5;
  // Only in queue mode: reject an invoke once this many requests are already queued.
  // 0 uses a server default. Ignored in coalesce mode (latest-wins self-bounds to 1).
  int32 max_queue_depth = 6;
}

enum WorkflowState {
  WORKFLOW_STATE_UNSPECIFIED = 0;
  WORKFLOW_STATE_ACTIVE      = 1;
  WORKFLOW_STATE_PAUSED   = 2;
  WORKFLOW_STATE_COOLDOWN = 3;
  WORKFLOW_STATE_DISABLED = 4;
  WORKFLOW_STATE_SUSPENDED = 5;
}

// PendingApproval is the currently open approval gate for a workflow — populated
// on Workflow only while lifecycle_state is awaiting_approval. Read-only; the
// approval_id here is what approve_workflow/reject_workflow expect.
message PendingApproval {
  string approval_id = 1;
  string justification = 2;
  google.protobuf.Struct metadata = 3;
  google.protobuf.Timestamp opened_at = 4;
  google.protobuf.Timestamp timeout_at = 5;
}

// PendingInput is the currently open input gate for a workflow — populated on
// Workflow only while lifecycle_state is awaiting_input. Read-only; the input_id
// here is what submit_input expects.
message PendingInput {
  string input_id = 1;
  string prompt = 2;
  google.protobuf.Struct metadata = 3;
  google.protobuf.Timestamp opened_at = 4;
  google.protobuf.Timestamp timeout_at = 5;
}

// Suspension is the operator hold currently on a workflow — populated on Workflow only
// while workflow_state is WORKFLOW_STATE_SUSPENDED. Read-only; the suspension_id here is
// what resume_workflow expects.
message Suspension {
  string suspension_id = 1;
  string reason = 2;
  // Whether the run in flight when the suspension landed was stopped rather than drained.
  bool stop_current = 3;
  // Whether queued requests were abandoned rather than held for the resume.
  bool abandon_queued = 4;
  google.protobuf.Timestamp requested_at = 5;
  // Set once nothing is running any more; the workflow is only resumable after this.
  google.protobuf.Timestamp finalized_at = 6;
}

// Workflow is a managed, stateful unit of agent execution tied to a specific
// tenant. Managed via the WorkflowService.
message Workflow {
  string id = 1;
  string workflow_type = 2;
  string tenant_id = 3;
  google.protobuf.Timestamp created_at = 6;
  WorkflowConfig workflow_config = 8;
  string lifecycle_state = 9;
  WorkflowState workflow_state = 10;
  // request_id of the run that interrupted the workflow; empty until one is interrupted.
  string last_interrupted_request_id = 11;
  PendingApproval pending_approval = 12;
  PendingInput pending_input = 13;
  // Set once DeleteWorkflow has been called; unset while the workflow is not
  // pending deletion. lifecycle_state only moves to "deleted" once any in-flight
  // work has finished.
  google.protobuf.Timestamp deletion_requested_at = 14;
  // Pass back as ActivateWorkflowRequest.request_id to resume from paused/cooldown.
  string last_policy_decision_request_id = 15;
  // The operator hold currently on the workflow; unset when it is not suspended.
  Suspension suspension = 16;
}
